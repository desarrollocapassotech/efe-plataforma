# Postgres local para tests e2e, alternativa a la rama `test` de Neon.
#   docker compose up -d db
# y en apps/api/.env.test: DATABASE_URL=DIRECT_URL=postgresql://efe:efe@localhost:5433/efe_test
# Credenciales solo locales, sin valor fuera de esta máquina.
services:
  db:
    # Misma versión mayor que Neon (Postgres 18).
    image: postgres:18
    environment:
      POSTGRES_USER: efe
      POSTGRES_PASSWORD: efe
      POSTGRES_DB: efe_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U efe -d efe_test']
      interval: 2s
      timeout: 3s
      retries: 15
